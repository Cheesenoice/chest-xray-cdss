# 3-Class Clean Benchmark — Kermany only (Normal / Bacterial / Viral)
# Chỉ dùng nguồn Kermany để có benchmark sạch nhất, không bị domain confound TB.
# Đây là kết quả chính trong paper. Config 4-class = configs/default.yaml.

seed: 42
seeds: [42, 7, 123]
backbones: ["resnet18", "densenet121", "efficientnet_b0"]

data:
  num_classes: 3
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/processed/splits_kermany3"
  image_size: 224
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  external_sources: []
  dedup: true
  imbalance_strategy: "weighted_sampler"
  augmentation:
    horizontal_flip: true
    rotate_deg: 12
    brightness_contrast: 0.2

model:
  backbone: "densenet121"
  pretrained: true
  drop_rate: 0.2

train:
  batch_size: 32
  num_workers: 2
  epochs: 15
  lr: 0.0001
  weight_decay: 0.01
  scheduler: "cosine"
  early_stopping_patience: 5
  use_amp: true

explainability:
  gradcam_target_layer: "features.denseblock4"
